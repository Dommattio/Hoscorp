# Resolver en tiempo de petición: el Gateway arranca aunque un servicio esté caído.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location = /health { return 200 '{"service":"gateway","status":"ok"}'; add_header Content-Type application/json; }

    location /api/operativo/ {
        set $up http://svc-operativo:8001;
        rewrite ^/api/operativo/(.*)$ /$1 break;
        proxy_pass $up;
        error_page 502 503 504 = @caido;
    }
    location /api/historias/ {
        set $up http://svc-historias-clinicas:8002;
        rewrite ^/api/historias/(.*)$ /$1 break;
        proxy_pass $up;
        error_page 502 503 504 = @caido;
    }
    location /api/pagos/ {
        set $up http://svc-pagos:8003;
        rewrite ^/api/pagos/(.*)$ /$1 break;
        proxy_pass $up;
        error_page 502 503 504 = @caido;
    }
    location /api/hospital/ {
        set $up http://hospital-simulado:8004;
        rewrite ^/api/hospital/(.*)$ /$1 break;
        proxy_pass $up;
        error_page 502 503 504 = @caido;
    }
    location @caido {
        default_type application/json;
        return 503 '{"detail":"Servicio no disponible"}';
    }
}
