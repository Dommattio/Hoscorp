server {
    listen 80;
    listen 443 ssl;
    server_name localhost hoscorp.local;

    # Certificados X.509 RSA-2048 SHA-256 para cifrado en transito (HTTPS/TLS)
    ssl_certificate /etc/nginx/certs/hoscorp.crt;
    ssl_certificate_key /etc/nginx/certs/hoscorp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy al Service Registry (:5002)
    location /api/registry/ {
        proxy_pass http://service-registry:5002/api/v1/registry/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    # Reverse proxy al Notification Service (:5001)
    location /api/notifications/ {
        proxy_pass http://notification-service:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    # Reverse proxy CIFRADO EN TRANSITO (HTTPS/TLS :5443) hacia el Backend Clinico
    location /api/ {
        proxy_pass https://backend:5443/api/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-TLS-Protocol $ssl_protocol;
        proxy_set_header X-TLS-Cipher $ssl_cipher;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    location /backend-health {
        proxy_pass https://backend:5443/health;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /notification-health {
        proxy_pass http://notification-service:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /registry-health {
        proxy_pass http://service-registry:5002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"UP","node":"hoscorp-frontend","service":"web-portal","role":"Frontend Nginx HTTPS/TLS Gateway","tlsEnabled":true}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
