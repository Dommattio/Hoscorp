version: '3.8'

# ==============================================================================
# HOSCORP - PROGRAMACIÓN DISTRIBUIDA Y COMPONENTES - ENTREGA 2: INFRAESTRUCTURA
# Definición de Nodos Físicamente Separados (Contenedores Docker Independientes)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # NODO 1: Backend API Clínico (clinical-records-service)
  # Proceso independiente en Node.js que expone endpoints REST y persiste datos
  # ----------------------------------------------------------------------------
  backend:
    container_name: hoscorp-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_NAME=hoscorp-backend-clinical
      - PORT=5000
      - DATA_DIR=/data
      - NODE_ENV=production
    volumes:
      - backend_data:/data
    networks:
      - hoscorp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # NODO 2: Portal Web Interactivo (Frontend Nginx)
  # Proceso independiente en Nginx Alpine que sirve la UI y actúa de proxy reverso
  # ----------------------------------------------------------------------------
  frontend:
    container_name: hoscorp-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - hoscorp-net
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

# Red virtual bridge que interconecta físicamente ambos nodos en aislamiento
networks:
  hoscorp-net:
    driver: bridge
    name: hoscorp-net

# Volumen persistente para datos clínicos desacoplados del ciclo de vida del contenedor
volumes:
  backend_data:
    name: hoscorp-backend-data
